<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website to APK Builder</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="py-6 border-b border-slate-800 text-center">
        <h1 class="text-3xl font-extrabold tracking-tight text-blue-400">SubangDev Bulider</h1>
        <p class="text-sm text-slate-400 mt-1">Ubah website atau blog Anda menjadi Aplikasi Android (APK) dalam hitungan detik.</p>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-xl flex-grow">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
            <form id="apkForm" class="space-y-6">
                <!-- URL Website -->
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">URL Website / Blog</label>
                    <input type="url" name="websiteUrl" required placeholder="https://example.com" 
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-white">
                </div>

                <!-- Nama Aplikasi -->
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">Nama Aplikasi</label>
                    <input type="text" name="appName" required placeholder="Contoh: Toko Online Saya" 
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-white">
                </div>

                <!-- Nama Paket (Package Name) -->
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">Package Name (Opsional)</label>
                    <input type="text" name="packageNmae" placeholder="com.namaperusahaan.app" 
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-white">
                </div>

                <!-- Upload Ikon -->
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">Ikon Aplikasi (PNG/JPG)</label>
                    <input type="file" name="icon" accept="image/png, image/jpeg" 
                        class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
                </div>

                <!-- Tombol Submit -->
                <button type="submit" id="submitBtn" 
                    class="w-full py-3 bg-blue-600 hover:bg-blue-700 font-semibold rounded-lg transition duration-200 shadow-lg">
                    Build APK Sekarang
                </button>
            </form>

            <!-- Loading Indicator -->
            <div id="loading" class="hidden text-center mt-6 space-y-3">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
                <p class="text-sm text-slate-400">Sedang meracik APK Anda... Mohon tunggu sebentar.</p>
            </div>

            <!-- Result Box -->
            <div id="result" class="hidden mt-6 p-4 bg-slate-900 border border-green-500/50 rounded-lg text-center space-y-3">
                <p class="text-green-400 font-semibold" id="resultMessage"></p>
                <a id="downloadBtn" href="#" class="inline-block px-6 py-2 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg text-sm transition">
                    Download APK
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-800">
        &copy; 2026 Web2APK Studio. Built with Node.js & Tailwind.
    </footer>

    <!-- JavaScript Client Script -->
    <script>
        const form = document.getElementById('apkForm');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');
        const resultMessage = document.getElementById('resultMessage');
        const downloadBtn = document.getElementById('downloadBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Sembunyikan form & tampilkan loading
            form.classList.add('hidden');
            loading.classList.remove('hidden');
            result.classList.add('hidden');

            const formData = new FormData(form);

            try {
                const response = await fetch('/api/build-apk', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();

                loading.classList.add('hidden');

                if (data.success) {
                    resultMessage.textContent = data.message;
                    downloadBtn.href = data.downloadUrl;
                    result.classList.remove('hidden');
                } else {
                    alert(data.message || 'Terjadi kesalahan.');
                    form.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                alert('Gagal terhubung ke server.');
                loading.classList.add('hidden');
                form.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
